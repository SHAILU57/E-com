<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shop</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .search-bar {
            flex: 1;
            margin: 10px 20px;
            display: flex;
        }

        .search-bar input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px 0 0 4px;
        }

        .search-bar button {
            padding: 8px 12px;
            border: none;
            background: #312e81;
            color: white;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .nav-icons {
            display: flex;
            gap: 15px;
        }

        .hero {
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .section {
            padding: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }

        .product-card p {
            margin: 5px 0;
            font-weight: bold;
        }

        .product-card button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #1e1b4b;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-bar {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">🛒 AI Shop</div>
        <div class="search-bar">
            <input type="text" placeholder="Search products (Smart AI Search)...">
            <button>Search</button>
        </div>
        <div class="nav-icons">
            <span>Login</span>
            <span>Cart 🛍 (0)</span>
        </div>
    </header>

    <!-- HERO SECTION -->
    <div class="hero">
        <h1>Smart Shopping Powered by AI</h1>
        <p>Personalized recommendations just for you</p>
    </div>

    <!-- RECOMMENDED PRODUCTS -->
    <div class="section">
        <h2>🤖 Recommended For You</h2>
        <div class="products">
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Wireless Headphones</h3>
                <p>₹1999</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Smart Watch</h3>
                <p>₹2499</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- TRENDING PRODUCTS -->
    <div class="section">
        <h2>🔥 Trending Products</h2>
        <div class="products">
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Running Shoes</h3>
                <p>₹1499</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Backpack</h3>
                <p>₹999</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 AI Shop | Smart E-Commerce Experience</p>
    </footer>

    <script>
        let cartCount = 0;
        function addToCart() {
            cartCount++;
            document.querySelector(".nav-icons span:last-child").innerText = "Cart 🛍 (" + cartCount + ")";
            alert("Item added to cart!");
        }
    </script>

</body>
</html>
