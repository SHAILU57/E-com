<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Intellicart - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        /* Header */
        .header {
            background: #4f46e5;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .search-bar {
            flex: 1;
            margin: 10px 20px;
            display: flex;
            max-width: 500px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px 0 0 4px;
        }

        .search-bar button {
            padding: 8px 12px;
            border: none;
            background: #312e81;
            color: white;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .icons {
            display: flex;
            gap: 15px;
            font-size: 14px;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        /* Sections */
        .section {
            padding: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }

        .product-card p {
            margin: 5px 0;
            font-weight: bold;
        }

        .product-card button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #1e1b4b;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .search-bar {
                margin: 10px 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">🛒 Intellicart</div>

        <div class="search-bar">
            <input type="text" placeholder="Search smart products...">
            <button>Search</button>
        </div>

        <div class="icons">
            <span>👤 My Account</span>
            <span>🛍 Cart (<span id="cartCount">0</span>)</span>
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <h1>Welcome Back to Intellicart</h1>
        <p>Your AI-powered personalized shopping assistant</p>
    </div>

    <!-- Recommended Section -->
    <div class="section">
        <h2>🤖 Recommended For You</h2>
        <div class="products">
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Smart Fitness Band</h3>
                <p>₹1,499</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Bluetooth Speaker</h3>
                <p>₹1,299</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Trending Section -->
    <div class="section">
        <h2>🔥 Trending Now</h2>
        <div class="products">
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Wireless Earbuds</h3>
                <p>₹2,199</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h3>Backpack</h3>
                <p>₹899</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>
        © 2026 Intellicart | Smart AI Shopping
    </footer>

    <script>
        let cart = 0;
        function addToCart() {
            cart++;
            document.getElementById("cartCount").innerText = cart;
            alert("Added to cart!");
        }
    </script>

</body>
</html>
