<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shop Auth</title>
  <style>
    body { font-family: Arial; background:#f3f4f6; display:flex; justify-content:center; align-items:center; height:100vh; }
    .container { background:white; padding:25px; border-radius:10px; width:300px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; }
    input { width:100%; padding:8px; margin:8px 0; }
    button { width:100%; padding:10px; background:#4f46e5; color:white; border:none; border-radius:5px; cursor:pointer; }
    .toggle { text-align:center; margin-top:10px; color:blue; cursor:pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2 id="formTitle">Register</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="mobile" placeholder="Mobile Number">

  <button onclick="register()">Register</button>
  <button onclick="login()" style="display:none" id="loginBtn">Login</button>

  <input type="text" id="otp" placeholder="Enter OTP" style="display:none">
  <button onclick="verifyOTP()" style="display:none" id="otpBtn">Verify OTP</button>

  <div class="toggle" onclick="toggleForm()">Already have account? Login</div>
</div>

<script>
let isLogin = false;
let currentEmail = "";

function toggleForm() {
  isLogin = !isLogin;
  document.getElementById("formTitle").innerText = isLogin ? "Login" : "Register";
  document.querySelector(".toggle").innerText = isLogin ? "New user? Register" : "Already have account? Login";
  document.querySelector("button").style.display = isLogin ? "none" : "block";
  document.getElementById("loginBtn").style.display = isLogin ? "block" : "none";
}

async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const mobile = document.getElementById("mobile").value;

  const res = await fetch("http://localhost:5000/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, mobile })
  });

  const data = await res.json();
  alert(data.message);
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch("http://localhost:5000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();
  if (data.success) {
    currentEmail = email;
    document.getElementById("otp").style.display = "block";
    document.getElementById("otpBtn").style.display = "block";
    alert("OTP sent to your mobile (check server console)");
  } else {
    alert(data.message);
  }
}

async function verifyOTP() {
  const otp = document.getElementById("otp").value;

  const res = await fetch("http://localhost:5000/verify-otp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: currentEmail, otp })
  });

  const data = await res.json();
  alert(data.message);
}
</script>

</body>
</html>
