<!DOCTYPE html>
<html>
<head>
    <title>Intellicart - AI Powered Shopping</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #dbeafe, #e0e7ff);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #4f46e5;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-buttons button {
            margin-left: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn {
            background-color: white;
            color: #4f46e5;
        }

        .register-btn {
            background-color: #22c55e;
            color: white;
        }

        /* Center Content */
        .container {
            text-align: center;
            margin-top: 80px;
        }

        input {
            width: 250px;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .main-btn {
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .tagline {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">🛒 Intellicart</div>
        <div class="nav-buttons">
            <button class="login-btn">Login</button>
            <button class="register-btn">Register</button>
        </div>
    </div>

    <!-- Centered Content -->
    <div class="container">
        <h2>Welcome to Intellicart</h2>
        <p class="tagline">Smart Shopping Experience</p>

        <input type="email" placeholder="Enter Email"><br>
        <input type="password" placeholder="Enter Password"><br>
        <input type="text" placeholder="Enter Mobile Number"><br>

        <button class="main-btn">Submit</button>
    </div>

</body>
</html>
